<app-auth-card
  title="Reset your password"
  subtitle="Enter your email and we'll send you a link to choose a new one."
>
  @if (sentTo(); as email) {
    <div class="alert success auth-alert" role="status">
      If <strong>{{ email }}</strong> has an account, a reset link is on its way. Check your inbox
      and your spam folder.
    </div>
  } @else {
    <div class="auth-form" [formGroup]="form">
      <l-email-input
        label="Email"
        formControlName="email"
        placeholder="you@example.com"
        autocomplete="email"
        (enter)="send()"
      />

      @if (error(); as message) {
        <div class="alert error auth-alert" role="alert">{{ message }}</div>
      }

      <div class="auth-form__actions">
        <l-button size="lg" width="full" [disabled]="busy() || !configured" (click)="send()">
          {{ busy() ? 'Sending…' : 'Send reset link' }}
        </l-button>
      </div>
    </div>
  }

  <div class="auth-links">
    <a class="auth-link" routerLink="/login">Back to sign in</a>
  </div>
</app-auth-card>
