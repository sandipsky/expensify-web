<router-outlet />

@if (!auth.settled()) {
  <div class="app-boot" role="status" aria-live="polite">
    <span class="app-boot__brand">Expensify</span>
    <span class="app-boot__pulse" aria-hidden="true"></span>
    <p class="app-boot__text">
      @if (slow()) {
        Still connecting… check your internet connection.
      } @else {
        Loading your account
      }
    </p>
  </div>
}

<!-- The one blocking wait, for work such as deleting the account (SpinnerService). -->
<l-loading-spinner />
