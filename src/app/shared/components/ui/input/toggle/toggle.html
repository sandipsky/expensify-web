@if (viewMode()) {
  <div class="form-group view-mode">
    @if (label()) {
      <label>{{ label() }}</label>
    }
    <div class="view-value">{{ viewValue() ?? (_checked() ? 'Yes' : 'No') }}</div>
  </div>
} @else {
  <div class="form-group">
    <label
      class="control-row"
      [class.label-left]="labelPosition() === 'left'"
      [class.label-top]="labelPosition() === 'top'"
    >
      <span class="switch">
        <input
          type="checkbox"
          [id]="id()"
          [checked]="_checked()"
          [disabled]="_isDisabled()"
          (change)="_handleChange($event)"
          (blur)="_handleBlur()"
        />
        <span class="slider round"></span>
      </span>

      @if (label()) {
        <span class="control-label">{{ label() }}</span>
      }
    </label>
  </div>
}
