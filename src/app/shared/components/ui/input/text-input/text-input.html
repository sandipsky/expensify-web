@if (viewMode()) {
  <div class="form-group view-mode">
    @if (label()) {
      <label>{{ label() }}</label>
    }
    <div class="view-value">{{ viewValue() ?? (_value() || '-') }}</div>
  </div>
} @else {
  <div class="form-group">
    @if (label()) {
      <label [attr.for]="id()">{{ label() }}</label>
    }

    <input
      class="form-control"
      [id]="id()"
      [type]="type"
      [value]="_value()"
      [placeholder]="placeholder()"
      [disabled]="_isDisabled()"
      [attr.aria-label]="ariaLabel() || null"
      [attr.list]="suggestions().length ? id() + '-suggestions' : null"
      [attr.autocomplete]="suggestions().length ? 'off' : null"
      (input)="_handleInput($event)"
      (change)="change.emit($event)"
      (keyup)="keyup.emit($event)"
      (keydown)="keydown.emit($event)"
      (keypress)="keypress.emit($event)"
      (keydown.enter)="_handleEnter($event)"
      (blur)="_handleBlur()"
    />

    @if (suggestions().length) {
      <datalist [id]="id() + '-suggestions'">
        @for (suggestion of suggestions(); track suggestion) {
          <option [value]="suggestion"></option>
        }
      </datalist>
    }
  </div>
}
