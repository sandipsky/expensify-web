<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ExpensifyWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- The saved theme (SET-06) before the first paint, so dark mode doesn't flash light. -->
  <script>
    try {
      var theme = localStorage.getItem('expensify.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
